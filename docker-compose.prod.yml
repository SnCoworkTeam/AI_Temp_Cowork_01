version: '3.8'

# 生产环境Docker Compose配置
# 使用Docker Hub镜像，而不是本地构建

services:
  # PostgreSQL数据库服务
  postgres:
    image: postgres:15
    container_name: enterprise-ai-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-ai_platform}
      POSTGRES_USER: ${DB_USER:-ai_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ai_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ai_user} -d ${DB_NAME:-ai_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - enterprise-ai-network
    restart: always
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"

  # Redis缓存服务
  redis:
    image: redis:7-alpine
    container_name: enterprise-ai-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - enterprise-ai-network
    restart: always

  # Qdrant向量数据库
  qdrant:
    image: qdrant/qdrant:latest
    container_name: enterprise-ai-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 5
    networks:
      - enterprise-ai-network
    restart: always

  # Neo4j图数据库
  neo4j:
    image: neo4j:5-community
    container_name: enterprise-ai-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j_password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_dbms_memory_pagecache_size: 512m
      NEO4J_dbms_memory_transaction_total_max: 256M
      NEO4J_dbms_transaction_timeout: 60s
      NEO4J_dbms_lock_acquisition_timeout: 10s
      NEO4J_dbms_connector_bolt_listen__address: 0.0.0.0:7687
      NEO4J_dbms_connector_http_listen__address: 0.0.0.0:7474
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-neo4j_password}", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - enterprise-ai-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 1G

  # Registry Service - 使用Docker Hub镜像
  registry-service:
    image: ${DOCKER_HUB_USERNAME}/enterprise-ai-platform-registry-service:${IMAGE_TAG:-latest}
    container_name: enterprise-ai-registry-service
    ports:
      - "${REGISTRY_SERVICE_PORT:-8000}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - HEALTH_CHECK_INTERVAL=10
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - enterprise-ai-network
    restart: always

  # API Gateway - 使用Docker Hub镜像
  api-gateway:
    image: ${DOCKER_HUB_USERNAME}/enterprise-ai-platform-api-gateway:${IMAGE_TAG:-latest}
    container_name: enterprise-ai-api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - DEBUG=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REGISTRY_SERVICE_URL=http://registry-service:8000
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_PER_MINUTE=60
      - CIRCUIT_BREAKER_ENABLED=true
      - METRICS_ENABLED=true
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      registry-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - enterprise-ai-network
    restart: always

  # Config Center - 使用Docker Hub镜像
  config-center:
    image: ${DOCKER_HUB_USERNAME}/enterprise-ai-platform-config-center:${IMAGE_TAG:-latest}
    container_name: enterprise-ai-config-center
    ports:
      - "${CONFIG_CENTER_PORT:-8090}:8090"
    environment:
      - HOST=0.0.0.0
      - PORT=8090
      - DEBUG=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - REGISTRY_SERVICE_URL=http://registry-service:8000
      - SERVICE_HOST=config-center
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      registry-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - enterprise-ai-network
    restart: always

  # MCP Gateway - 使用Docker Hub镜像
  mcp-gateway:
    image: ${DOCKER_HUB_USERNAME}/enterprise-ai-platform-mcp-gateway:${IMAGE_TAG:-latest}
    container_name: enterprise-ai-mcp-gateway
    ports:
      - "${MCP_GATEWAY_PORT:-8001}:8001"
    environment:
      - HOST=0.0.0.0
      - PORT=8001
      - DEBUG=false
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-ai_user}
      - DB_PASSWORD=${DB_PASSWORD:-ai_password}
      - DB_NAME=${DB_NAME:-ai_platform}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKFLOW_ENGINE_URL=http://workflow-engine:8002
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://43.143.139.197:3000
      - MCP_SERVERS=${MCP_SERVERS:-[]}
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - enterprise-ai-network
    restart: always

  # Workflow Engine - 使用Docker Hub镜像
  workflow-engine:
    image: ${DOCKER_HUB_USERNAME}/enterprise-ai-platform-workflow-engine:${IMAGE_TAG:-latest}
    container_name: enterprise-ai-workflow-engine
    ports:
      - "${WORKFLOW_ENGINE_PORT:-8002}:8002"
    environment:
      - HOST=0.0.0.0
      - PORT=8002
      - DEBUG=false
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-ai_user}
      - DB_PASSWORD=${DB_PASSWORD:-ai_password}
      - DB_NAME=${DB_NAME:-ai_platform}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MCP_GATEWAY_URL=http://mcp-gateway:8001
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - enterprise-ai-network
    restart: always

  # Web UI - 使用Docker Hub镜像
  web-ui:
    image: ${DOCKER_HUB_USERNAME}/enterprise-ai-platform-web-ui:${IMAGE_TAG:-latest}
    container_name: enterprise-ai-web-ui
    ports:
      - "${WEB_UI_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_GATEWAY_URL=http://43.143.139.197:8080
      - NEXT_PUBLIC_MCP_GATEWAY_URL=http://43.143.139.197:8001
      - NEXT_PUBLIC_WORKFLOW_ENGINE_URL=http://43.143.139.197:8002
      - NEXT_PUBLIC_AUTH_SERVICE_URL=http://43.143.139.197:8080/api/auth
      - NEXT_PUBLIC_KNOWLEDGE_BASE_URL=http://43.143.139.197:8004
      - NEXT_PUBLIC_METADATA_SERVICE_URL=http://43.143.139.197:8005
      - METADATA_SERVICE_URL=http://metadata-service:8005
      - NEXT_PUBLIC_CONFIG_CENTER_URL=http://43.143.139.197:8080/api/config
      - NEXT_PUBLIC_AGENT_SERVICE_URL=http://43.143.139.197:8010
      - NEXT_PUBLIC_AGENT_ORCHESTRATOR_URL=http://43.143.139.197:8011
      - API_GATEWAY_URL=http://api-gateway:8080
      - WORKFLOW_ENGINE_URL=http://workflow-engine:8002
      - AUTH_SERVICE_URL=http://auth-service:8003
      - MCP_GATEWAY_URL=http://mcp-gateway:8001
      - AGENT_SERVICE_URL=http://agent-service:8010
    env_file:
      - .env
    depends_on:
      - api-gateway
      - workflow-engine
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - enterprise-ai-network
    restart: always

  # Auth Service - 使用Docker Hub镜像
  auth-service:
    image: ${DOCKER_HUB_USERNAME}/enterprise-ai-platform-auth-service:${IMAGE_TAG:-latest}
    container_name: enterprise-ai-auth-service
    ports:
      - "${AUTH_SERVICE_PORT:-8003}:8003"
    environment:
      - HOST=0.0.0.0
      - PORT=8003
      - DEBUG=false
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-ai_user}
      - DB_PASSWORD=${DB_PASSWORD:-ai_password}
      - DB_NAME=${DB_NAME:-ai_platform}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - enterprise-ai-network
    restart: always

  # Knowledge Base - 使用Docker Hub镜像
  knowledge-base:
    image: ${DOCKER_HUB_USERNAME}/enterprise-ai-platform-knowledge-base:${IMAGE_TAG:-latest}
    container_name: enterprise-ai-knowledge-base
    ports:
      - "${KNOWLEDGE_BASE_PORT:-8004}:8004"
    environment:
      - HOST=0.0.0.0
      - PORT=8004
      - DEBUG=false
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-ai_user}
      - DB_PASSWORD=${DB_PASSWORD:-ai_password}
      - DB_NAME=${DB_NAME:-ai_platform}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - VECTOR_STORE_TYPE=${VECTOR_STORE_TYPE:-chroma}
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - EMBEDDING_DEVICE=${EMBEDDING_DEVICE:-cpu}
      - DOCUMENT_STORAGE_DIR=/app/documents
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-104857600}
      - CHUNK_SIZE=${CHUNK_SIZE:-1000}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-200}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    env_file:
      - .env
    volumes:
      - knowledge_base_documents:/app/documents
      - knowledge_base_chroma:/app/chroma_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - enterprise-ai-network
    restart: always

  # Metadata Service - 使用Docker Hub镜像
  metadata-service:
    image: ${DOCKER_HUB_USERNAME}/enterprise-ai-platform-metadata-service:${IMAGE_TAG:-latest}
    container_name: enterprise-ai-metadata-service
    ports:
      - "${METADATA_SERVICE_PORT:-8005}:8005"
    environment:
      - HOST=0.0.0.0
      - PORT=8005
      - DEBUG=false
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-ai_user}
      - DB_PASSWORD=${DB_PASSWORD:-ai_password}
      - DB_NAME=${DB_NAME:-ai_platform}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_RELATIONSHIP_DISCOVERY_ENABLED=${LLM_RELATIONSHIP_DISCOVERY_ENABLED:-true}
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - enterprise-ai-network
    restart: always

  # Chat Service - 使用Docker Hub镜像
  chat-service:
    image: ${DOCKER_HUB_USERNAME}/enterprise-ai-platform-chat-service:${IMAGE_TAG:-latest}
    container_name: enterprise-ai-chat-service
    ports:
      - "${CHAT_SERVICE_PORT:-8006}:8006"
    environment:
      - HOST=0.0.0.0
      - PORT=8006
      - DEBUG=false
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-ai_user}
      - DB_PASSWORD=${DB_PASSWORD:-ai_password}
      - DB_NAME=${DB_NAME:-ai_platform}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AUTH_SERVICE_URL=http://auth-service:8003
      - KNOWLEDGE_BASE_URL=http://knowledge-base:8004
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - enterprise-ai-network
    restart: always

  # Agent Service - 使用Docker Hub镜像
  agent-service:
    image: ${DOCKER_HUB_USERNAME}/enterprise-ai-platform-agent-service:${IMAGE_TAG:-latest}
    container_name: enterprise-ai-agent-service
    ports:
      - "${AGENT_SERVICE_PORT:-8010}:8010"
    environment:
      - HOST=0.0.0.0
      - PORT=8010
      - DEBUG=false
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MCP_GATEWAY_URL=http://mcp-gateway:8001
      - WORKFLOW_ENGINE_URL=http://workflow-engine:8002
      - DAG_ORCHESTRATOR_URL=http://dag-orchestrator:8009
      - KNOWLEDGE_BASE_URL=http://knowledge-base:8004
      - CHAT_SERVICE_URL=http://chat-service:8006
      - MEMORY_SERVICE_URL=http://memory-service:8013
      - METADATA_SERVICE_URL=http://metadata-service:8005
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.7}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-4096}
      - PROMPT_ENGINE_ENABLED=true
      - PROMPT_CACHE_ENABLED=true
      - PROMPT_CACHE_SIZE=500
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - enterprise-ai-network
    restart: always

  # Agent Orchestrator - 使用Docker Hub镜像
  agent-orchestrator:
    image: ${DOCKER_HUB_USERNAME}/enterprise-ai-platform-agent-orchestrator:${IMAGE_TAG:-latest}
    container_name: enterprise-ai-agent-orchestrator
    ports:
      - "${AGENT_ORCHESTRATOR_PORT:-8011}:8011"
    environment:
      - HOST=0.0.0.0
      - PORT=8011
      - DEBUG=false
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - AGENT_SERVICE_URL=http://agent-service:8010
      - REGISTRY_SERVICE_URL=http://registry-service:8000
      - CONFIG_CENTER_URL=http://config-center:8090
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    env_file:
      - .env
    depends_on:
      - agent-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - enterprise-ai-network
    restart: always

  # Agent Registry - 使用Docker Hub镜像
  agent-registry:
    image: ${DOCKER_HUB_USERNAME}/enterprise-ai-platform-agent-registry:${IMAGE_TAG:-latest}
    container_name: enterprise-ai-agent-registry
    ports:
      - "${AGENT_REGISTRY_PORT:-8012}:8012"
    environment:
      - HOST=0.0.0.0
      - PORT=8012
      - DEBUG=false
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    env_file:
      - .env
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - enterprise-ai-network
    restart: always

  # DAG Orchestrator - 使用Docker Hub镜像
  dag-orchestrator:
    image: ${DOCKER_HUB_USERNAME}/enterprise-ai-platform-dag-orchestrator:${IMAGE_TAG:-latest}
    container_name: enterprise-ai-dag-orchestrator
    ports:
      - "${DAG_ORCHESTRATOR_PORT:-8009}:8009"
    environment:
      - HOST=0.0.0.0
      - PORT=8009
      - DEBUG=false
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MCP_GATEWAY_URL=http://mcp-gateway:8001
      - WORKFLOW_ENGINE_URL=http://workflow-engine:8002
      - KNOWLEDGE_BASE_URL=http://knowledge-base:8004
      - CHAT_SERVICE_URL=http://chat-service:8006
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    env_file:
      - .env
    networks:
      - enterprise-ai-network
    restart: always

  # Memory Service - 使用Docker Hub镜像
  memory-service:
    image: ${DOCKER_HUB_USERNAME}/enterprise-ai-platform-memory-service:${IMAGE_TAG:-latest}
    container_name: enterprise-ai-memory-service
    ports:
      - "${MEMORY_SERVICE_PORT:-8013}:8013"
    environment:
      - HOST=0.0.0.0
      - PORT=8013
      - DEBUG=false
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=memories
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - qdrant
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8013/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - enterprise-ai-network
    restart: always

  # SAP Metadata Agent - 使用Docker Hub镜像
  sap-metadata-agent:
    image: ${DOCKER_HUB_USERNAME}/enterprise-ai-platform-sap-metadata-agent:${IMAGE_TAG:-latest}
    container_name: enterprise-ai-sap-metadata-agent
    ports:
      - "${SAP_METADATA_AGENT_PORT:-8015}:8015"
    environment:
      - HOST=0.0.0.0
      - PORT=8015
      - DEBUG=false
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CONFIG_CENTER_URL=http://config-center:8090
      - MCP_GATEWAY_URL=http://mcp-gateway:8001
      - METADATA_SERVICE_URL=http://metadata-service:8005
      - KNOWLEDGE_BASE_URL=http://knowledge-base:8004
      - AGENT_SERVICE_URL=http://agent-service:8010
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    env_file:
      - .env
    depends_on:
      - metadata-service
      - mcp-gateway
      - config-center
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8015/api/sap-metadata/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - enterprise-ai-network
    restart: always

  # SAP MCP Server - 使用Docker Hub镜像
  sap-mcp-server:
    image: ${DOCKER_HUB_USERNAME}/enterprise-ai-platform-sap-mcp-server:${IMAGE_TAG:-latest}
    container_name: enterprise-ai-sap-mcp-server
    ports:
      - "${SAP_MCP_SERVER_PORT:-3001}:3000"
    environment:
      - CONFIG_CENTER_URL=http://config-center:8090
      - SAP_BASE_URL=${SAP_BASE_URL:-}
      - SAP_CLIENT=${SAP_CLIENT:-100}
      - SAP_USERNAME=${SAP_USERNAME:-}
      - SAP_PASSWORD=${SAP_PASSWORD:-}
      - SAP_LANGUAGE=${SAP_LANGUAGE:-EN}
      - PORT=3000
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ODATA_ALLOW_ALL=${ODATA_ALLOW_ALL:-true}
      - ODATA_MAX_SERVICES=${ODATA_MAX_SERVICES:-200}
    env_file:
      - .env
    depends_on:
      config-center:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - enterprise-ai-network
    restart: always

  # Vector Coordinator Service - 使用Docker Hub镜像
  vector-coordinator-service:
    image: ${DOCKER_HUB_USERNAME}/enterprise-ai-platform-vector-coordinator-service:${IMAGE_TAG:-latest}
    container_name: enterprise-ai-vector-coordinator
    ports:
      - "${VECTOR_COORDINATOR_PORT:-8020}:8020"
    environment:
      - HOST=0.0.0.0
      - PORT=8020
      - DEBUG=false
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - EMBEDDING_DEVICE=cpu
      - FUSION_STRATEGY=weighted_average
      - SIMILARITY_METRIC=cosine
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - USE_QDRANT=true
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - HF_ENDPOINT=https://hf-mirror.com
    env_file:
      - .env
    depends_on:
      - registry-service
      - qdrant
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8020/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - enterprise-ai-network
    restart: always

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  knowledge_base_documents:
    driver: local
  knowledge_base_chroma:
    driver: local

networks:
  enterprise-ai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
