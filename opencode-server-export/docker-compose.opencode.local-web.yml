# OpenCode 本地 Web + 旧版 API 代理方案：
# - Node 代理提供本地静态资源（/app-web）
# - OpenCode API 使用 1.1.51（避免 1.1.54 的 AsyncLocalStorage 上下文问题）

services:
  # LLM 代理：统一 tool_calls/function_call 格式
  opencode-llm-proxy:
    image: enterprise-ai-opencode:latest
    container_name: enterprise-ai-opencode-llm-proxy
    working_dir: /app
    command: node /app/server.js
    environment:
      - PORT=18080
      - UPSTREAM_BASE_URL=${LLM_BASE_URL:-https://ai.sinochem.com/api/model-service/v1}
      - LOG_LEVEL=info
    volumes:
      - ../opencode-llm-proxy/server.js:/app/server.js:ro
    networks:
      - enterprise-ai-network
    restart: unless-stopped

  # Web 入口：静态资源 + 反向代理
  opencode:
    image: enterprise-ai-opencode:latest
    container_name: enterprise-ai-opencode
    working_dir: /app
    command: node /app/opencode-web-proxy.js
    ports:
      - "${OPENCODE_PORT:-4096}:4096"
    environment:
      - PORT=4096
      - WEB_ROOT=/app-web
      - API_HOST=opencode-api
      - API_PORT=4096
    volumes:
      - ./app-web:/app-web:ro
      - ./opencode-web-proxy.js:/app/opencode-web-proxy.js:ro
    depends_on:
      - opencode-api
    networks:
      - enterprise-ai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://127.0.0.1:4096/ > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # API 服务：使用 1.1.51，避免 1.1.54 上下文错误
  opencode-api:
    image: enterprise-ai-opencode:latest
    container_name: enterprise-ai-opencode-api
    working_dir: /workspace
    command: opencode serve --hostname 0.0.0.0 --port 4096
    environment:
      - OPENCODE_SERVER_USERNAME=${OPENCODE_SERVER_USERNAME:-opencode}
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-}
      # 锁定工作目录为项目根，仅针对当前项目操作（见 docs/deployment/OpenCode-限定项目根目录说明.md）
      - OPENCODE_LOCK_WORKSPACE=1
      # 持久化：模型列表与 API Key 存于此处，不设则重启后供应商/DeepSeek 等会丢失
      - HOME=/opencode-home
      # 内网/离线时指定模型列表文件，见 docs/deployment/OpenCode-模型加载与内网配置.md
      - OPENCODE_MODELS_PATH=${OPENCODE_MODELS_PATH:-}
      - OPENCODE_MODELS_URL=${OPENCODE_MODELS_URL:-}
      - OPENCODE_DISABLE_MODELS_FETCH=${OPENCODE_DISABLE_MODELS_FETCH:-}
      # 中化集团模型 Bearer Token（项目根 opencode.jsonc 已配置 sinochem 供应商）
      - SINOCHEM_API_KEY=${SINOCHEM_API_KEY:-}
    volumes:
      - ${OPENCODE_WORKSPACE:-.}:/workspace:cached
      # 持久化数据目录（auth.json、models.json 等），避免重启后模型与 API Key 丢失
      - opencode-data:/opencode-home
      # 仅使用中化模型清单与配置（禁用外网模型获取）
      - ./models.sinochem.json:/opt/opencode-models.json:ro
      - ./opencode.jsonc:/opencode-home/.config/opencode/opencode.jsonc:ro
      # 挂载宿主机 Docker socket：使 OpenCode 在对话中可执行 docker / docker compose
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - enterprise-ai-network
    restart: unless-stopped
    healthcheck:
      # 服务端开启 Basic Auth 时需带认证，否则健康检查会 401 失败
      test: ["CMD", "sh", "-c", "curl -sf -u \"$$OPENCODE_SERVER_USERNAME:$$OPENCODE_SERVER_PASSWORD\" http://127.0.0.1:4096/global/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  enterprise-ai-network:
    external: true
    name: ${EXTERNAL_NETWORK_NAME:-enterprise-ai-platform_enterprise-ai-network}

volumes:
  opencode-data:
