map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 4096;
  server_name _;
  root /app-web;

  # 统一 CSP，避免外联
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; media-src 'self' data:; connect-src 'self' data:" always;

  location = / {
    try_files /index.html =404;
  }

  location = /changelog.json {
    try_files /changelog.json =404;
  }

  location /assets/ {
    try_files $uri =404;
  }

  location ~* \.(js|css|png|svg|ico|json|woff2?|ttf|map)$ {
    try_files $uri =404;
  }

  # OpenCode API 路由转发到旧版服务端（1.1.51）
  location ~ ^/(global|project|pty|config|experimental|session|permission|question|provider|mcp|tui|instance|path|vcs|command|log|agent|skill|lsp|formatter|event|file|find) {
    proxy_pass http://opencode-api:4096;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600;
  }

  # 其余走 SPA
  location / {
    try_files $uri /index.html;
  }
}
