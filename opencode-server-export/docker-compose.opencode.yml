# OpenCode 独立部署 - 与官方一致（opencode serve + 代理 app.opencode.ai）
# 使用前请先加载镜像: docker load -i enterprise-ai-opencode.tar
# 参考: docs/deployment/OpenCode同机部署实施方案.md
# 模型加载（内网无法访问 models.dev 时）: docs/deployment/OpenCode-模型加载与内网配置.md

services:
  # LLM 代理：统一 tool_calls/function_call 格式
  opencode-llm-proxy:
    image: enterprise-ai-opencode:latest
    container_name: enterprise-ai-opencode-llm-proxy
    working_dir: /app
    command: node /app/server.js
    environment:
      - PORT=18080
      - UPSTREAM_BASE_URL=${LLM_BASE_URL:-https://ai.sinochem.com/api/model-service/v1}
      - LOG_LEVEL=info
    volumes:
      - ../opencode-llm-proxy/server.js:/app/server.js:ro
    networks:
      - enterprise-ai-network
    restart: unless-stopped

  opencode:
    image: enterprise-ai-opencode:latest
    container_name: enterprise-ai-opencode
    working_dir: /workspace
    # 官方方式：serve 模式，根路径 / 会代理到 https://app.opencode.ai（需容器能访问外网）
    command: opencode serve --hostname 0.0.0.0 --port 4096
    ports:
      - "${OPENCODE_PORT:-4096}:4096"
    environment:
      - OPENCODE_SERVER_USERNAME=${OPENCODE_SERVER_USERNAME:-opencode}
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-}
      # 锁定工作目录为项目根（可选，见 docs/deployment/OpenCode-限定项目根目录说明.md）
      - OPENCODE_LOCK_WORKSPACE=${OPENCODE_LOCK_WORKSPACE:-1}
      # 内网/离线时指定模型列表文件路径，见 docs/deployment/OpenCode-模型加载与内网配置.md
      - OPENCODE_MODELS_PATH=${OPENCODE_MODELS_PATH:-}
      - OPENCODE_MODELS_URL=${OPENCODE_MODELS_URL:-}
      - OPENCODE_DISABLE_MODELS_FETCH=${OPENCODE_DISABLE_MODELS_FETCH:-}
      # 中化集团模型 Bearer Token（项目根 opencode.jsonc 已配置 sinochem 供应商）
      - SINOCHEM_API_KEY=${SINOCHEM_API_KEY:-}
    volumes:
      - ${OPENCODE_WORKSPACE:-.}:/workspace:cached
      # 内网时挂载本地 models.json（需先在 .env 中设置 OPENCODE_MODELS_PATH=/opt/opencode-models.json）
      - ./models.sinochem.json:/opt/opencode-models.json:ro
      - ./opencode.jsonc:/opencode-home/.config/opencode/opencode.jsonc:ro
    networks:
      - enterprise-ai-network
    restart: unless-stopped
    healthcheck:
      # 配置了 OPENCODE_SERVER_PASSWORD 时需带认证，否则 401 会导致 unhealthy
      test: ["CMD", "sh", "-c", "curl -sf -u \"$$OPENCODE_SERVER_USERNAME:$$OPENCODE_SERVER_PASSWORD\" http://127.0.0.1:4096/global/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  enterprise-ai-network:
    external: true
    # 与主 compose 创建的网络一致，服务器上执行 docker network ls 查看实际名称后填到 .env 的 EXTERNAL_NETWORK_NAME
    name: ${EXTERNAL_NETWORK_NAME:-enterprise-ai-platform_enterprise-ai-network}
