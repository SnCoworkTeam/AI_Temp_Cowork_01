version: '3.8'

services:
  neo4j:
    image: neo4j:5-community
    container_name: enterprise-ai-neo4j
    environment:
      NEO4J_AUTH: neo4j/Neo4j@2024
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_memory_heap_initial__size: 1G
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 1G
      NEO4J_dbms_memory_transaction_total_max: 512M
      NEO4J_dbms_transaction_timeout: 60s
      NEO4J_dbms_lock_acquisition_timeout: 10s
      NEO4J_dbms_connector_bolt_thread__pool__max__size: 100
      NEO4J_dbms_connector_bolt_listen__address: 0.0.0.0:7687
      NEO4J_dbms_connector_http_listen__address: 0.0.0.0:7474
      NEO4J_dbms_connector_https_listen__address: 0.0.0.0:7473
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
    volumes:
      - /opt/neo4j/data:/data
      - /opt/neo4j/logs:/logs
      - /opt/neo4j/import:/var/lib/neo4j/import
      - /opt/neo4j/plugins:/plugins
    ports:
      - "7474:7474"
      - "7687:7687"
      - "7473:7473"
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "Neo4j@2024", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 2G
          cpus: '1'

networks:
  default:
    name: neo4j-network
    driver: bridge

