# Redis配置文件
# 开发环境配置

# 绑定地址
bind 0.0.0.0

# 保护模式（开发环境可以关闭）
protected-mode no

# 端口
port 6379

# 持久化配置
save 900 1
save 300 10
save 60 10000

# AOF持久化
appendonly yes
appendfsync everysec

# 日志级别
loglevel notice

# 最大内存（开发环境，根据需求调整）
maxmemory 256mb
maxmemory-policy allkeys-lru

# 慢查询日志
slowlog-log-slower-than 10000
slowlog-max-len 128









