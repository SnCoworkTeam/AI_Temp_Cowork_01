version: '3.8'

services:
  # Neo4j - 图数据库（独立服务器部署）
  neo4j:
    image: neo4j:5-community
    container_name: enterprise-ai-neo4j-standalone
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j_password}
      # 插件配置（可根据需要启用）
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      
      # 内存配置（根据服务器配置调整）
      # 推荐配置：
      # - 2h4g服务器：Heap 1G, PageCache 512m
      # - 4h8g服务器：Heap 2G, PageCache 1G
      # - 8h16g服务器：Heap 4G, PageCache 2G
      NEO4J_dbms_memory_heap_initial__size: 1G
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 1G
      NEO4J_dbms_memory_transaction_total_max: 512M
      
      # 性能优化配置
      NEO4J_dbms_transaction_timeout: 60s
      NEO4J_dbms_lock_acquisition_timeout: 10s
      
      # 连接池配置
      NEO4J_dbms_connector_bolt_thread__pool__max__size: 100
      NEO4J_dbms_connector_http_thread__pool__max__size: 50
      
      # 允许远程访问（生产环境建议配置防火墙）
      NEO4J_dbms_connector_bolt_listen__address: 0.0.0.0:7687
      NEO4J_dbms_connector_http_listen__address: 0.0.0.0:7474
      NEO4J_dbms_connector_https_listen__address: 0.0.0.0:7473
      
      # 安全配置（生产环境必须配置）
      # NEO4J_dbms_security_procedures_unrestricted: apoc.*
      # NEO4J_dbms_security_procedures_allowlist: apoc.*
      
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    ports:
      # 开放端口供远程访问
      - "${NEO4J_HTTP_PORT:-7474}:7474"   # HTTP Web界面
      - "${NEO4J_BOLT_PORT:-7687}:7687"   # Bolt协议（应用连接）
      - "${NEO4J_HTTPS_PORT:-7473}:7473"  # HTTPS（可选）
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-neo4j_password}", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # 根据服务器配置调整
          memory: 4G
          cpus: '2'
        reservations:
          memory: 2G
          cpus: '1'

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  neo4j_plugins:
    driver: local

networks:
  default:
    name: neo4j-network

