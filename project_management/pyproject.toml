[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | _build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["database", "project_management", "api_gateway", "auth_service"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "dist",
    "build",
    ".next",
    "node_modules"
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "EM", "ISC", "ICN", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SIM", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "RUF"]
ignore = [
    "E501",  # 行长度（由Black处理）
    "E203",  # 切片冒号前空格（与Black兼容）
    "B008",  # 函数调用中的默认参数
    "C901",  # 函数过于复杂
    "PLR0913",  # 参数过多
    "PLR2004",  # 魔法值
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # 允许未使用的导入
"tests/**/*.py" = ["E501", "F401", "PLR2004"]  # 测试文件放宽规则

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
show_error_codes = true
warn_return_any = true
disallow_untyped_defs = false
follow_imports = "normal"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "database.*",
    "project_management.*",
    "api_gateway.*",
    "auth_service.*"
]
ignore_missing_imports = true

[tool.pylint.master]
max-line-length = 120
ignore = ["venv", ".venv", "__pycache__", "dist", "build"]

[tool.pylint.format]
max-line-length = 120

