[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luminaos-common"
version = "1.0.0"
description = "LuminaOS共享库 - 企业AI平台通用组件"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "LuminaOS Team", email = "team@luminaos.com"}
]
keywords = ["luminaos", "ai", "workflow", "enterprise"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pydantic>=2.0.0",
    "typing-extensions>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/yourorg/enterprise-ai-platform"
Documentation = "https://docs.luminaos.com"
Repository = "https://github.com/yourorg/enterprise-ai-platform"

[tool.setuptools.packages.find]
where = ["."]
include = ["luminaos_common*"]
exclude = ["tests*", "docs*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
